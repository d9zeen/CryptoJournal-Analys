# Сайт на GitHub Pages: при каждом обновлении основной ветки — тесты, сборка, выкладка.
# Адрес: https://<владелец>.github.io/<репозиторий>/
# Нужно один раз: Settings → Pages → Source: GitHub Actions.
# Ключи Supabase — публичные (те же, что в .env.example), задаются прямо здесь, а не в секретах:
# так их видно и нельзя случайно перебить старым секретом. Сменил проект — поменяй значения ниже
# и в .env.example. service_role / secret key сюда НЕ класть никогда.
name: Сайт на GitHub Pages

on:
  push:
    branches: [claude/amazing-bohr-gt7ta9]
  workflow_dispatch: # кнопка «Run workflow» — пересобрать вручную (например, после смены ключей)

# по умолчанию — только чтение; права на выкладку получает лишь шаг deploy
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # известные уязвимости в зависимостях сайта (high и выше) — сборка падает
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Сборка
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://dkjavndvuulnzflowdhj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_b-HoCt2aJnh-PSAlMxrEsw_U8nbSs0i
      # GitHub Pages не умеет SPA-фолбэк: прямые ссылки (/trades/123) отдаём через 404.html = index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
