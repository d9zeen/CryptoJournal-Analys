# Проверки при каждом изменении: типы, тесты логики, тесты базы (RLS) на настоящем Postgres,
# сквозные тесты в браузере. Сайт выкладывает отдельный workflow pages.yml.
name: Проверки

on:
  pull_request:
  push:
    branches: [claude/amazing-bohr-gt7ta9]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Типы и тесты логики
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  database:
    name: Тесты базы и защиты (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Миграции + тесты RLS
        run: ./scripts/test-db.sh | tee db.log && grep -q 'ВСЕ ТЕСТЫ БАЗЫ ПРОЙДЕНЫ' db.log

  e2e:
    name: Сквозные тесты в браузере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
