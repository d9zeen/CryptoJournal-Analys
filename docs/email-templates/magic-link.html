<!-- CryptoJournal: письмо на двух языках. Язык — из аккаунта (user_metadata.lang, сайт ставит его сам); нет языка — по-русски -->
<div style="margin:0;padding:32px 16px;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1c1b22">
  <div style="max-width:480px;margin:0 auto;background:#fbf9f4;border:1px solid #e4dfd3;border-radius:14px;padding:28px">
    <div style="font-size:18px;font-weight:700;letter-spacing:-0.01em;margin-bottom:20px">CryptoJournal</div>
{{ if and .Data.lang (eq .Data.lang "en") }}
    <p style="margin:0 0 12px;font-size:15px;line-height:1.55">Your CryptoJournal sign-in link.</p>
    <p style="margin:24px 0">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5b45e0;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px">Sign in</a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#6b6877">If you did not try to sign in, just delete this email.</p>
{{ else }}
    <p style="margin:0 0 12px;font-size:15px;line-height:1.55">Ссылка для входа в CryptoJournal.</p>
    <p style="margin:24px 0">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5b45e0;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px">Войти</a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#6b6877">Если вы не пытались войти — просто удалите это письмо.</p>
{{ end }}
  </div>
</div>
